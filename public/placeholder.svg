<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 
    This SVG serves as a placeholder image for the concept of "Civic Issues".
    It includes various icons representing common urban and social problems,
    arranged in a circular composition.
  -->

  <!-- Background color -->
  <rect width="100%" height="100%" fill="#F5F3ED"/>

  <!-- Main container group for all graphic elements -->
  <g fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer dashed border -->
    <rect x="25" y="25" width="350" height="350" fill="none" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Central composition group, centered in the viewbox -->
    <g transform="translate(200, 200)">
      
      <!-- Inner dashed circle -->
      <circle r="110" stroke-width="1.5" stroke-dasharray="5,3"/>
      
      <!-- Center Gear Element -->
      <g>
        <circle r="55" stroke-width="2.5"/>
        <!-- Gear teeth -->
        <g stroke-width="2.5">
          <path d="M 0 -55 L 0 -65"/>
          <path d="M 39 -39 L 46 -46"/>
          <path d="M 55 0 L 65 0"/>
          <path d="M 39 39 L 46 46"/>
          <path d="M 0 55 L 0 65"/>
          <path d="M -39 39 L -46 46"/>
          <path d="M -55 0 L -65 0"/>
          <path d="M -39 -39 L -46 -46"/>
        </g>
        <!-- Crack in the center -->
        <path d="M -10 -30 Q 5 0, -5 30" stroke-width="2"/>
      </g>

      <!-- Icon: Overflowing Trash Can -->
      <g transform="translate(-75, -80)">
        <path d="M -10 -10 L 10 -10 L 8 10 L -8 10 Z" />
        <path d="M -12 -10 H 12" />
        <path d="M -5 -10 Q 0 -18, 5 -10" />
        <path d="M -2 -11 Q 3 -15, 7 -9" />
      </g>
      
      <!-- Icon: Crumbling Monument -->
      <g transform="translate(0, -95)">
        <path d="M -15 15 L -15 -5 A 15 15 0 0 1 15 -5 L 15 15" />
        <path d="M 8 -5 L 10 -2" />
        <path d="M 0 -15 L -2 -12 L 2 -12 Z" fill="#2D2D2D"/>
      </g>
      
      <!-- Icon: Factory Pollution -->
      <g transform="translate(75, -80)">
        <path d="M -10 15 L -10 0 L 15 0 L 15 15 Z" />
        <path d="M 0 0 L 0 -10 L 5 -10 L 5 -15" />
        <path d="M 8 -15 Q 12 -18, 14 -14" />
        <path d="M 10 -18 Q 14 -21, 16 -17" />
      </g>
      
      <!-- Icon: Withered Tree and Broken Wall -->
      <g transform="translate(95, 20)">
        <path d="M 0 15 V -5 L -10 -15" />
        <path d="M 0 -5 L 10 -10 L 5 -18" />
        <path d="M -18 15 H 0" />
        <path d="M -15 12 L -12 15" />
        <path d="M -8 12 L -5 15" />
        <path d="M -10 15 L -10 8 L -4 8 L -4 15"/>
      </g>

      <!-- Icon: Protester -->
      <g transform="translate(65, 85)">
        <circle cx="0" cy="-8" r="4" />
        <path d="M 0 -4 V 5 L -5 12" />
        <path d="M 0 5 L 5 12" />
        <path d="M -2 0 L -15 0" />
        <rect x="-25" y="-12" width="10" height="12"/>
      </g>
      
      <!-- Icon: Unclear Sign / Graffiti -->
      <g transform="translate(-70, 85)">
          <rect x="-15" y="-10" width="30" height="20"/>
          <path d="M -10 -5 Q -5 0, 0 -5 Q 5 0, 10 -5" />
          <path d="M -10 5 Q 0 0, 10 5" />
      </g>
      
      <!-- Icon: Pests / Bugs -->
      <g>
        <g transform="translate(-100, 30)">
          <path d="M 0 0 C 5 -5, 10 5, 15 0" />
          <path d="M 7.5 -2.5 L 7.5 5" />
          <path d="M 4 2 L -2 5" />
          <path d="M 11 2 L 17 5" />
        </g>
        <g transform="translate(-90, 60)">
          <path d="M 0 0 C 5 -5, 10 5, 15 0" />
          <path d="M 7.5 -2.5 L 7.5 5" />
          <path d="M 4 2 L -2 5" />
          <path d="M 11 2 L 17 5" />
        </g>
      </g>
      
    </g>
  </g>
  
  <!-- Text Labels -->
  <g fill="#2D2D2D" text-anchor="middle">
    <text x="200" y="80" font-size="24" font-weight="bold" letter-spacing="1">CIVIC ISSUES</text>
    <text x="200" y="345" font-size="14" letter-spacing="0.5">PLACEHOLDER IMAGE</text>
  </g>

</svg>
